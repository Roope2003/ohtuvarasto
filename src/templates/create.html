{% extends "base.html" %}

{% block title %}Create Warehouse - Ohtuvarasto{% endblock %}

{% block content %}
<div class="card">
    <h2>Create New Warehouse</h2>
    <form method="POST" action="{{ url_for('create_warehouse') }}">
        <div class="form-group">
            <label for="name">Warehouse Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter warehouse name">
        </div>
        <div class="form-group">
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" name="capacity" step="0.01" min="0" required placeholder="Enter capacity">
        </div>
        <div class="form-group">
            <label for="initial_balance">Initial Balance (optional)</label>
            <input type="number" id="initial_balance" name="initial_balance" step="0.01" min="0" value="0" placeholder="Enter initial balance">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-success">Create Warehouse</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
