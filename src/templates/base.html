<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ohtuvarasto{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #f472b6;
            --primary-dark: #ec4899;
            --secondary: #a78bfa;
            --accent: #fbbf24;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --dark: #1a1025;
            --dark-light: #2d1f3d;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 182, 193, 0.3);
            --cat-pink: #ffb6c1;
            --cat-purple: #dda0dd;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1025 0%, #2d1f3d 30%, #1a1025 60%, #2d1f3d 100%);
            min-height: 100vh;
            color: #fce7f3;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 85%, rgba(244, 114, 182, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(167, 139, 250, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Floating paw prints animation */
        body::after {
            content: '🐾';
            position: fixed;
            font-size: 60px;
            opacity: 0.03;
            top: 20%;
            right: 10%;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(26, 16, 37, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--glass-border);
            padding: 20px 0;
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f472b6, #a78bfa, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1::before {
            content: '🐱';
            -webkit-text-fill-color: initial;
            font-size: 2rem;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            color: #fce7f3;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            background: var(--glass);
            border: 2px solid var(--glass-border);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        nav a:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(244, 114, 182, 0.4);
        }

        .flash-messages {
            margin-bottom: 20px;
        }

        .flash {
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flash::before {
            content: '😺';
            font-size: 1.2rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flash.success {
            background: rgba(52, 211, 153, 0.2);
            border-color: rgba(52, 211, 153, 0.5);
            color: #6ee7b7;
        }

        .flash.success::before {
            content: '😻';
        }

        .flash.error {
            background: rgba(248, 113, 113, 0.2);
            border-color: rgba(248, 113, 113, 0.5);
            color: #fca5a5;
        }

        .flash.error::before {
            content: '🙀';
        }

        .card {
            background: rgba(45, 31, 61, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 2px solid var(--glass-border);
            padding: 28px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '🐾';
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            opacity: 0.15;
        }

        .card:hover {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 20px 40px rgba(244, 114, 182, 0.15);
            transform: translateY(-2px);
        }

        .card h2 {
            color: #fce7f3;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #f9a8d4;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="search"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(244, 114, 182, 0.3);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(26, 16, 37, 0.6);
            color: #fce7f3;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="search"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.2);
        }

        input::placeholder {
            color: #9f7aea;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 20px rgba(244, 114, 182, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(244, 114, 182, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #10b981);
            color: white;
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(52, 211, 153, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ef4444);
            color: white;
            box-shadow: 0 4px 20px rgba(248, 113, 113, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(248, 113, 113, 0.5);
        }

        .btn-secondary {
            background: rgba(167, 139, 250, 0.2);
            color: #e9d5ff;
            border: 2px solid rgba(167, 139, 250, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(167, 139, 250, 0.3);
            transform: translateY(-2px);
        }

        .warehouse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .warehouse-card {
            background: rgba(45, 31, 61, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 2px solid var(--glass-border);
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .warehouse-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .warehouse-card::after {
            content: '😸';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .warehouse-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 25px 50px rgba(244, 114, 182, 0.2),
                        0 0 80px rgba(167, 139, 250, 0.1);
        }

        .warehouse-card:hover::after {
            content: '😻';
            opacity: 0.6;
            transform: scale(1.2);
        }

        .warehouse-card h3 {
            color: #fce7f3;
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .warehouse-stats {
            margin-bottom: 20px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(244, 114, 182, 0.15);
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #f9a8d4;
            font-size: 0.9rem;
        }

        .stat-value {
            font-weight: 700;
            color: #fce7f3;
            font-size: 1.1rem;
        }

        .progress-bar {
            background: rgba(167, 139, 250, 0.2);
            border-radius: 12px;
            height: 14px;
            overflow: hidden;
            margin-top: 16px;
            border: 1px solid rgba(244, 114, 182, 0.2);
        }

        .progress-fill {
            height: 100%;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #f9a8d4;
        }

        .inline-form {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .inline-form .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .search-box {
            margin-bottom: 24px;
            position: relative;
        }

        .search-box input {
            padding-left: 50px;
        }

        .search-box::before {
            content: '🐱';
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .section-header h2 {
            color: #fce7f3;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2::before {
            content: '🐾';
        }

        .stats-summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stats-summary .stat-box {
            background: rgba(244, 114, 182, 0.15);
            padding: 12px 20px;
            border-radius: 16px;
            border: 2px solid rgba(244, 114, 182, 0.3);
        }

        .stats-summary .stat-box span {
            color: #f9a8d4;
            font-size: 0.85rem;
        }

        .stats-summary .stat-box strong {
            color: #fce7f3;
            margin-left: 8px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #f9a8d4;
        }

        .no-results .icon {
            font-size: 5rem;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #9f7aea;
            font-size: 0.9rem;
        }

        footer::before {
            content: '🐱 ';
        }

        footer::after {
            content: ' 🐱';
        }

        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                text-align: center;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .inline-form {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-summary {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Meow-varasto</h1>
            <nav>
                <a href="{{ url_for('index') }}">🏠 Home</a>
                <a href="{{ url_for('create_warehouse') }}">🐾 Create</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Meow-varasto &copy; 2025 — Built with Flask & Purrs 💕</p>
    </footer>
</body>
</html>
